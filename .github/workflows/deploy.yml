name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # dung npm install (khong phai npm ci) vi repo khong commit package-lock.json
      - run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LOGIN_DOMAIN: ${{ vars.VITE_LOGIN_DOMAIN }}
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_BUILD_NO: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      # Chot chan: bao dam luon co version.json dung so build, ke ca khi
      # plugin trong vite.config.js vi ly do nao do khong chay.
      - name: Ghi version.json
        run: |
          printf '{"build":"%s","commit":"%s","time":"%s"}\n' \
            "${{ github.run_number }}" "${GITHUB_SHA:0:7}" "$(date -u +%FT%TZ)" \
            > dist/version.json
          cat dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
